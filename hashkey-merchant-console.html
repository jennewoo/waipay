  function render(){const p=state.page;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));document.getElementById('app').innerHTML=({overview,crypto,fiat,bank,convert,withdraw,transactions,webhook})[p]();if(p==='transactions')document.querySelector('.title').textContent='交易记录';if(p==='crypto')document.querySelectorAll('.panel-sub').forEach(x=>{if(x.textContent.includes('新增地址后'))x.textContent='新增地址用于接收充值；充值时将校验付款钱包地址'})}
  function createdAddress(){modal('充值地址已新增',`<p style="margin-top:0">USDT · TRON</p><div class="address">TXyzExampleDepositAddress123456789</div><div class="hint">请将该地址提供给付款方；到账情况可在交易记录中查看。</div>`,`<button class="button" onclick="copy('TXyzExampleDepositAddress123456789')">复制地址</button><button class="button primary" onclick="closeModal()">完成</button>`)}
  function goCryptoTransactions(){state.transactionsTab='crypto';go('transactions')}
  function render(){const p=state.page;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));document.getElementById('app').innerHTML=({overview,crypto,fiat,bank,convert,withdraw,transactions,webhook})[p]();if(p==='transactions')document.querySelector('.title').textContent='交易记录';if(p==='crypto'){document.querySelectorAll('.panel-sub').forEach(x=>{if(x.textContent.includes('新增地址后'))x.textContent='新增地址用于接收充值；到账情况可在交易记录中查看'});document.querySelectorAll('button').forEach(x=>{if(x.textContent.trim()==='充值记录')x.onclick=goCryptoTransactions});document.querySelectorAll('button.link').forEach(x=>{if(x.textContent.trim()==='充值'){x.textContent='交易记录';x.onclick=goCryptoTransactions}})}}
  function transactions(){let t=state.transactionsTab;let content=t==='crypto'?`<table><thead><tr><th>充值编号</th><th>币种 / 网络</th><th>链上金额</th><th>已入账</th><th>状态</th><th>创建时间</th><th class="right">操作</th></tr></thead><tbody><tr><td>dep_01HK8M3R2Y</td><td>USDT / TRON</td><td>500.00 USDT</td><td>500.00 USDT</td><td>${badge('SUCCESS')}</td><td>2026-09-22 16:32:11</td><td class="right"><button class="link" onclick="showDeposit('success')">详情</button></td></tr><tr><td>dep_01HK8A9V1KP</td><td>USDT / TRON</td><td>99.50 USDT</td><td>0.00 USDT</td><td><span class="status pending">来源钱包验证中</span></td><td>2026-09-22 14:08:34</td><td class="right"><button class="link" onclick="showDeposit('verification')">查看处理详情</button></td></tr></tbody></table>`:t==='fiat'?`<table><thead><tr><th>转出编号</th><th>币种</th><th>金额</th><th>收款账户</th><th>状态</th><th>创建时间</th><th class="right">操作</th></tr></thead><tbody><tr><td>fiat_ord_abc123</td><td>USD</td><td>1,000.00 USD</td><td>运营账户 · ••••4588</td><td>${badge('PROCESSING')}</td><td>2026-09-21 18:17:03</td><td class="right"><button class="link" onclick="showWithdrawal()">详情</button></td></tr></tbody></table>`:`<table><thead><tr><th>兑换编号</th><th>兑换方向</th><th>卖出金额</th><th>买入金额</th><th>状态</th><th>创建时间</th><th class="right">操作</th></tr></thead><tbody>${state.books.map(x=>`<tr><td>${x.id}</td><td>${x.sell.split(' ')[1]} → ${x.buy==='—'?'USD':x.buy.split(' ')[1]}</td><td>${x.sell}</td><td>${x.buy}</td><td>${badge(x.status)}</td><td>${x.time}</td><td class="right"><button class="link" onclick="go('convert')">详情</button></td></tr>`).join('')}</tbody></table>`;return header('交易记录','查看数字资产充值、资金转出和资产兑换记录',`<button class="button" onclick="toast('正在导出 CSV')">导出记录</button>`)+`<section class="card table-card"><div class="tabs"><button class="tab ${t==='crypto'?'active':''}" onclick="state.transactionsTab='crypto';render()">数币充值</button><button class="tab ${t==='fiat'?'active':''}" onclick="state.transactionsTab='fiat';render()">资金转出</button><button class="tab ${t==='convert'?'active':''}" onclick="state.transactionsTab='convert';render()">资产兑换</button></div><div class="panel" style="padding-bottom:0"><div class="search-row"><input class="field" placeholder="搜索交易编号"><select class="select"><option>全部状态</option><option>已完成</option><option>处理中</option><option>待确认</option></select><input class="field" type="date"><button class="button primary" onclick="toast('已刷新交易记录')">查询</button><button class="button" onclick="toast('筛选条件已重置')">重置</button></div></div>${content}<div class="table-bottom"><span>共 2 条</span><span>‹ &nbsp; <b style="color:var(--blue)">1</b> &nbsp; ›</span></div></section>`}
  function showDeposit(type='success'){let pending=type==='verification',data=pending?{id:'dep_01HK8A9V1KP',chain:'99.50',arrival:'0.00',created:'2026-09-22 14:08:34',tx:'0xdef789abc123456onchainhash',source:'TYabcSourceWallet987654321',target:'TXyzExampleDepositAddress123456789'}:{id:'dep_01HK8M3R2Y',chain:'500.00',arrival:'500.00',created:'2026-09-22 16:32:11',tx:'0xabc123def456789onchainhash',source:'TYabcSourceWallet987654321',target:'TXyzExampleDepositAddress123456789'};let status=pending?`<span class="status pending">来源钱包验证中</span>`:badge('SUCCESS');let statusNote=pending?`<div class="notice" style="margin-top:0">该笔转账尚未入账。链上金额可能与验证要求不一致，或付款钱包仍在验证中；请等待后续处理结果。</div>`:'';return modal('数币充值详情',`${statusNote}<div class="form-row"><label>充值编号</label><b>${data.id}</b></div><div class="form-row"><label>处理状态</label>${status}</div><div class="form-row"><label>币种与网络</label><b>USDT · TRON</b></div><div class="form-row"><label>链上金额 / 已入账金额</label><b>${data.chain} USDT / ${data.arrival} USDT</b></div><div class="form-row"><label>收款地址</label><div class="address">${data.target}</div></div><div class="form-row"><label>付款地址</label><div class="address">${data.source}</div></div><div class="form-row"><label>链上交易哈希</label><div class="address">${data.tx}</div></div><div class="form-row"><label>创建时间</label><b>${data.created}</b></div><div class="flow" style="padding:6px 0 0"><div class="flow-step"><span class="step-dot">1</span><div><b>已发现链上转账</b><p>${data.created}</p></div></div><div class="flow-step ${pending?'current':''}"><span class="step-dot">2</span><div><b>${pending?'正在确认来源钱包与转账金额':'已完成入账'}</b><p>${pending?'处理完成后会更新已入账金额。':'500.00 USDT 已计入账户余额。'}</p></div></div></div>`)}
  render();
</script>
