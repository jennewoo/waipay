<body>
  <main class="app">
    <aside class="sidebar"><div class="brand"><span class="logo">W</span><strong>Waipay</strong></div><div class="nav-item"><span class="nav-icon">◇</span>争议管理<span class="nav-count">24</span></div></aside>
    <section class="main">
      <header class="topbar"><div class="crumbs"><span>Waipay</span><b>/</b><span>争议管理</span></div><span class="avatar">W</span></header>
      <div class="content">
        <div class="heading"><div><p class="eyebrow">PAYPAL DISPUTES</p><h1>争议管理</h1></div><button class="btn">↥ 导出案件</button></div>
        <section class="metrics">
          <article class="metric"><span class="metric-mark m-blue">!</span><div><p>待处理案件</p><strong>24</strong><small>较上月 ↓ 8.6%</small></div></article>
          <article class="metric"><span class="metric-mark m-amber">£</span><div><p>争议金额</p><strong>£2,356.80</strong><small>涉及 18 个案件</small></div></article>
          <article class="metric"><span class="metric-mark m-green">✓</span><div><p>近 30 天解决</p><strong>180</strong><small>胜诉率 82.2%</small></div></article>
          <article class="metric"><span class="metric-mark m-violet">◷</span><div><p>平均处理时长</p><strong>7.2 小时</strong><small>比上月快 1.8 小时</small></div></article>
        </section>
        <section class="panel">
          <div class="tabs" id="tabs"><button class="tab active" data-tab="全部案件">全部案件</button><button class="tab" data-tab="需要处理">需要处理 <em>24</em></button><button class="tab" data-tab="等待对方">等待对方</button><button class="tab" data-tab="审核中">审核中</button><button class="tab" data-tab="已解决">已解决</button></div>
          <div class="toolbar"><label class="search">⌕<input id="search" placeholder="搜索案件 ID、交易 ID 或买家"></label><select id="reason"><option>全部类型</option><option>商品与说明不符</option><option>未收到物品</option><option>未经授权的交易</option></select><span class="results" id="results"></span></div>
          <div class="table-wrap"><table><thead><tr><th>案件</th><th>争议原因</th><th>金额</th><th>买家</th><th>状态</th><th>处理截止</th><th></th></tr></thead><tbody id="rows"></tbody></table><div class="empty" id="empty">没有找到符合条件的案件</div></div>
          <footer class="footer"><span>每页显示 10 条</span><div class="pages"><button>‹</button><button class="current">1</button><button>2</button><button>3</button><button>›</button></div></footer>
        </section>
      </div>
    </section>
  </main>

  <div class="action-menu" id="actionMenu"></div>
  <div class="overlay" id="drawerOverlay"><aside class="drawer" id="drawer"></aside></div>
  <div class="modal-overlay" id="modalOverlay"><section class="modal"><div class="modal-nav"><button class="back placeholder" id="modalBack">←</button><button class="modal-close" id="modalClose">×</button></div><div id="modalBody"></div></section></div>
  <div class="toast" id="toast"></div>

  <script>
    const cases=[
      {id:'PP-R-DWE-643711429',type:'查询',reason:'商品与说明不符',amount:26,currency:'GBP',buyer:'Jayne Ellis',email:'jayne.ellis@example.com',status:'待处理',deadline:'2026-09-20 08:03',opened:'2026-09-01',orderId:'8DX40371BH580164K',fee:0,note:'买家表示收到的商品与页面描述不一致。',address:'12 King Street, London, SW1A 2AA'},
      {id:'PP-R-NIC-642541059',type:'补偿申请',reason:'未经授权的交易',amount:42.25,currency:'GBP',buyer:'Christine Tester',email:'christine.t@example.com',status:'审核中',deadline:'—',opened:'2026-08-25',orderId:'6HP72813SD199840L',fee:2.06,note:'买家表示不认识此笔交易。',address:'8 River Road, Manchester, M1 4AB'},
      {id:'PP-D-284917350',type:'争议',reason:'未收到物品',amount:89.9,currency:'USD',buyer:'Olivia Martin',email:'olivia.m@example.com',status:'等待买家',deadline:'—',opened:'2026-08-24',orderId:'5KT88321MN414021A',fee:0,note:'物流长时间没有更新，买家表示尚未收到包裹。',address:'490 Market Street, San Francisco, CA'},
      {id:'PP-R-118629405',type:'索偿',reason:'未收到物品',amount:59.8,currency:'USD',buyer:'Harry Brown',email:'harry.b@example.com',status:'已解决',deadline:'—',opened:'2026-08-19',orderId:'6NF29550RE113280C',fee:0,note:'已向买家退款，案件已结束。',address:'24 Victoria Road, Bristol, BS1 5AA'}
    ];
    let activeTab='全部案件',selected=null,modalHistory=[];const $=id=>document.getElementById(id);const money=(n,c)=>`${n.toFixed(2)} ${c}`;const statusClass=s=>s==='待处理'?'pending':s==='审核中'?'review':s==='等待买家'?'wait':'done';
    function render(){const q=$('search').value.toLowerCase(),reason=$('reason').value;const list=cases.filter(c=>{const tab=activeTab==='全部案件'||(activeTab==='需要处理'&&c.status==='待处理')||(activeTab==='等待对方'&&c.status==='等待买家')||activeTab===c.status;return tab&&`${c.id} ${c.orderId} ${c.buyer}`.toLowerCase().includes(q)&&(reason==='全部类型'||reason===c.reason)});$('results').textContent=`共 ${list.length} 个案件`;$('empty').style.display=list.length?'none':'block';$('rows').innerHTML=list.map(c=>`<tr data-id="${c.id}"><td><strong class="case-id">${c.id}</strong><small>${c.type} · ${c.opened}</small></td><td>${c.reason}</td><td><strong>${money(c.amount,c.currency)}</strong></td><td><span class="buyer"><span class="mini">${c.buyer[0]}</span><span>${c.buyer}<small>${c.email}</small></span></span></td><td><span class="status s-${statusClass(c.status)}">${c.status}</span></td><td class="${c.status==='待处理'?'deadline':''}">${c.deadline}</td><td><button class="more" aria-label="更多操作" data-menu="${c.id}">⋮</button></td></tr>`).join('');document.querySelectorAll('#rows tr').forEach(row=>row.onclick=()=>openCaseDetails(cases.find(c=>c.id===row.dataset.id)));document.querySelectorAll('[data-menu]').forEach(btn=>btn.onclick=e=>{e.stopPropagation();openActionMenu(btn,cases.find(c=>c.id===btn.dataset.menu))})}
    function openActionMenu(btn,c){selected=c;const actions=[];if(c.status==='待处理')actions.push(['发放退款','resolve','important']);if(c.status==='审核中')actions.push(['结算金额','settle','important']);if(c.status!=='已解决')actions.push(['提供更多信息','evidence','']);actions.push(['案件时间线','timeline',''],['交易详情','transaction',''],['案件详情','details','']);$('actionMenu').innerHTML=actions.map(a=>`<button class="${a[2]}" data-action="${a[1]}"><span>${a[1]==='evidence'?'⇧':a[1]==='timeline'?'◷':a[1]==='transaction'?'↔':a[1]==='details'?'▤':'✓'}</span>${a[0]}</button>`).join('');const r=btn.getBoundingClientRect(),menu=$('actionMenu');menu.classList.add('show');const top=Math.max(8,Math.min(innerHeight-menu.offsetHeight-8,r.bottom+5));menu.style.top=`${top}px`;menu.style.left=`${Math.max(8,Math.min(innerWidth-menu.offsetWidth-8,r.right-menu.offsetWidth))}px`;document.querySelectorAll('#actionMenu [data-action]').forEach(x=>x.onclick=()=>{closeActionMenu();runAction(x.dataset.action,c)})}
    function closeActionMenu(){$('actionMenu').classList.remove('show');document.querySelectorAll('.more').forEach(x=>x.classList.remove('active'))}function runAction(a,c){selected=c;if(a==='resolve')openResolutionPicker();if(a==='settle')openSettlement();if(a==='evidence')openEvidence();if(a==='timeline')openTimeline(c);if(a==='transaction')openTransaction(c);if(a==='details')openCaseDetails(c)}
    function drawerShell(title,subtitle,body,actions=''){return `<div class="drawer-head"><div><h2>${title}</h2><p>${subtitle}</p></div><button class="close" data-close-drawer>×</button></div>${body}${actions?`<div class="drawer-actions">${actions}</div>`:''}`}
    function openDrawer(html){$('drawer').innerHTML=html;$('drawerOverlay').classList.add('show');$('drawer').scrollTop=0;document.body.style.overflow='hidden';document.querySelectorAll('[data-close-drawer]').forEach(x=>x.onclick=closeDrawer)}function closeDrawer(){$('drawerOverlay').classList.remove('show');if(!$('modalOverlay').classList.contains('show'))document.body.style.overflow=''}
    function openCaseDetails(c){selected=c;const body=`<div class="notice"><i>!</i><div><strong>${c.status==='待处理'?`请在 ${c.deadline} 前处理`:c.status==='审核中'?'PayPal 正在审核此案件':'案件状态已更新'}</strong><p>${c.note}</p></div></div><div class="details-grid"><div><small>争议金额</small><strong>${money(c.amount,c.currency)}</strong></div><div><small>案件类型</small><strong>${c.type}</strong></div><div><small>交易 ID</small><strong>${c.orderId}</strong></div><div><small>报告日期</small><strong>${c.opened}</strong></div></div><section class="section"><div class="section-title"><h3>问题详情</h3><span class="section-hint">案件资料</span></div><dl class="info"><div><dt>买家</dt><dd>${c.buyer}<small>${c.email}</small></dd></div><div><dt>商品</dt><dd>Review service × 1</dd></div><div><dt>买家说明</dt><dd>“${c.note}”</dd></div></dl></section><section class="section"><h3>最近进展</h3><ol class="timeline"><li class="current"><span class="timeline-mark">!</span><strong>${c.status==='待处理'?'等待商户处理':c.status==='审核中'?'PayPal 审核中':c.status}</strong><small>${c.deadline}</small></li><li><span class="timeline-mark">✓</span><strong>买家提出案件</strong><small>${c.opened}</small></li></ol></section>`;let actions='';if(c.status==='待处理')actions=`<button class="btn" data-evidence>提供更多信息</button><button class="btn primary" data-resolve>处理争议</button>`;else if(c.status==='审核中')actions=`<button class="btn" data-evidence>提供更多信息</button><button class="btn primary" data-settle>结算金额</button>`;else actions=`<button class="btn primary" data-timeline>查看案件时间线</button>`;openDrawer(drawerShell(c.reason,c.id,body,actions));const r=document.querySelector('[data-resolve]'),s=document.querySelector('[data-settle]'),e=document.querySelector('[data-evidence]'),t=document.querySelector('[data-timeline]');if(r)r.onclick=openResolutionPicker;if(s)s.onclick=openSettlement;if(e)e.onclick=openEvidence;if(t)t.onclick=()=>openTimeline(c)}
    function openTimeline(c){selected=c;const body=`<section class="section"><ol class="timeline"><li class="current"><span class="timeline-mark">▤</span><strong>${c.status==='已解决'?'案件已结束':'案件正在处理中'}</strong><small>2026-09-01</small><p>${c.status==='待处理'?'等待商户选择退款或退货退款方案。':'PayPal 已收到案件资料并正在处理。'}</p></li><li><span class="timeline-mark">⇧</span><strong>商户提供了跟踪信息</strong><small>2026-08-26</small><p>承运商：MANUAL<br>跟踪编号：WNBAA0491755688YQ<ul class="file-list"><li>跟踪文件.png</li><li>订单信息.png</li></ul></p></li><li><span class="timeline-mark">!</span><strong>${c.buyer} 提出案件</strong><small>${c.opened}</small><p>${c.note}</p></li><li><span class="timeline-mark">↔</span><strong>交易完成</strong><small>2026-08-20</small><p>交易编号：${c.orderId}</p></li></ol></section>`;openDrawer(drawerShell('案件时间线',c.id,body,`<button class="btn primary" data-details>查看案件详情</button>`));document.querySelector('[data-details]').onclick=()=>openCaseDetails(c)}
    function openTransaction(c){const body=`<section class="section"><div class="details-grid"><div><small>交易金额</small><strong>${money(c.amount,c.currency)}</strong></div><div><small>交易状态</small><strong>已完成</strong></div><div><small>交易 ID</small><strong>${c.orderId}</strong></div><div><small>交易日期</small><strong>2026-08-20</strong></div></div></section><section class="section"><h3>交易双方</h3><dl class="info"><div><dt>付款方</dt><dd>${c.buyer}<small>${c.email}</small></dd></div><div><dt>收款方</dt><dd>Waipay Merchant</dd></div><div><dt>付款类型</dt><dd>商品及服务</dd></div></dl></section>`;openDrawer(drawerShell('交易详情',c.orderId,body,`<button class="btn primary" data-details>查看案件详情</button>`));document.querySelector('[data-details]').onclick=()=>openCaseDetails(c)}
    function showModal(html,back=null){$('modalBody').innerHTML=html;$('modalOverlay').classList.add('show');document.body.style.overflow='hidden';const b=$('modalBack');b.classList.toggle('placeholder',!back);b.onclick=back||(()=>{});modalHistory=[]}function closeModal(){$('modalOverlay').classList.remove('show');if(!$('drawerOverlay').classList.contains('show'))document.body.style.overflow=''}
    function openResolutionPicker(){closeDrawer();showModal(`<h2 class="modal-title">处理争议</h2><p class="modal-desc">请选择适合此案件的解决方案。</p><div class="choice-group"><h3 class="choice-label">结束案件</h3><button class="choice" data-resolution="full"><span>全额退款</span><span>›</span></button><h3 class="choice-label">发送提议</h3><button class="choice" data-resolution="partial"><span>部分退款</span><span>›</span></button><button class="choice" data-resolution="return-partial"><span>退货并部分退款</span><span>›</span></button><button class="choice" data-resolution="return-full"><span>退货并全额退款</span><span>›</span></button></div>`);document.querySelectorAll('[data-resolution]').forEach(x=>x.onclick=()=>openResolutionForm(x.dataset.resolution))}
    function openResolutionForm(type){const c=selected,isFull=type==='full'||type==='return-full',needsReturn=type.startsWith('return'),title=type==='full'?'发放全额退款':type==='partial'?'发放部分退款':type==='return-partial'?'退货并部分退款':'退货并全额退款';const amountField=isFull?`<div class="summary-box"><div class="summary-row"><span>退款总额</span><strong>${money(c.amount,c.currency)}</strong></div><p class="rules">该金额将从您的 PayPal 账户中扣除，提交后案件将进入结束流程。</p></div>`:`<div class="field"><label>退款金额</label><div class="input-wrap"><input id="resolutionAmount" type="number" min="0.01" max="${c.amount}" step="0.01" placeholder="输入金额"><span class="currency">${c.currency}</span></div></div>`;const returnField=needsReturn?`<div class="field"><label>退货地址</label><div class="input-wrap"><select id="returnAddress"><option value="">选择退还物品的收货地址</option><option>${c.address}</option><option>Waipay Warehouse, 18 Dock Road</option></select></div></div>`:'';showModal(`<h2 class="modal-title">${title}</h2><p class="modal-desc">${needsReturn?'买家接受提议后，需要按所选地址退回物品。确认收货后即可处理退款。':'退款提交后，款项将原路退还给买家。'}</p><span class="overview-link">案件金额：${money(c.amount,c.currency)}</span>${amountField}${returnField}<div class="field"><label>内部参考编号（选填）</label><div class="input-wrap"><input id="referenceId" maxlength="64" placeholder="输入参考编号"></div></div><div class="field"><label>退款说明（选填）</label><textarea id="resolutionNote" maxlength="2000" placeholder="添加说明"></textarea><div class="counter"><span id="noteCount">0</span>/2000</div></div><div class="modal-actions"><button class="btn dark" id="submitResolution">${needsReturn?'发送提议':'确认退款'}</button></div>`,openResolutionPicker);const note=$('resolutionNote');note.oninput=()=>{$('noteCount').textContent=note.value.length};$('submitResolution').onclick=()=>{const amount=isFull?c.amount:Number($('resolutionAmount').value),address=needsReturn?$('returnAddress').value:'ok';if(!amount||amount<=0||amount>c.amount)return toast('请输入有效的退款金额');if(!address)return toast('请选择退货地址');finishAction(needsReturn?'退款提议已发送':'退款已提交处理')}}
    function openSettlement(){closeDrawer();const c=selected,principal=c.amount-c.fee;showModal(`<h2 class="modal-title">结算金额</h2><p class="modal-desc">确认后将从您的 PayPal 余额中扣除以下金额，并结束此案件。</p><span class="overview-link">案件编号：${c.id}</span><div class="summary-box"><div class="summary-row"><span>需要退还的金额</span><strong>${money(principal,c.currency)}</strong></div><div class="summary-row"><span>PayPal 案件费用</span><strong>${money(c.fee,c.currency)}</strong></div><div class="summary-row total"><span>结算总额</span><strong>${money(c.amount,c.currency)}</strong></div></div><div class="field"><label>结算说明（选填）</label><textarea id="settleNote" maxlength="2000" placeholder="添加说明"></textarea><div class="counter"><span id="settleCount">0</span>/2000</div></div><div class="modal-actions"><button class="btn dark" id="submitSettlement">确认结算</button></div>`);$('settleNote').oninput=()=>{$('settleCount').textContent=$('settleNote').value.length};$('submitSettlement').onclick=()=>finishAction('结算已提交')}
    function openEvidence(){closeDrawer();const c=selected;showModal(`<h2 class="modal-title">提供更多信息</h2><p class="modal-desc">上传有助于处理此案件的订单、物流或商品资料。</p><span class="overview-link">案件编号：${c.id}</span><label class="upload" for="evidenceFiles"><span><b>⇧</b>拖放或点击选择<small>最多上传 10 个文件</small></span></label><input id="evidenceFiles" type="file" multiple accept=".jpg,.jpeg,.gif,.png,.pdf,.txt" hidden><p class="rules">支持 JPG、JPEG、GIF、PNG、PDF、TXT；单个文件不超过 10MB，总大小不超过 50MB。</p><ul class="selected-files" id="selectedFiles"></ul><div class="field"><label>资料说明（选填）</label><textarea id="evidenceNote" maxlength="2000" placeholder="添加说明"></textarea><div class="counter"><span id="evidenceCount">0</span>/2000</div></div><div class="modal-actions"><button class="btn dark" id="submitEvidence">提交资料</button></div>`);$('evidenceFiles').onchange=()=>{$('selectedFiles').innerHTML=[...$('evidenceFiles').files].map(f=>`<li>▤ ${f.name}</li>`).join('')};$('evidenceNote').oninput=()=>{$('evidenceCount').textContent=$('evidenceNote').value.length};$('submitEvidence').onclick=()=>finishAction('案件资料已提交')}
    function finishAction(message){closeModal();closeDrawer();toast(message)}function toast(message){$('toast').textContent=`✓ ${message}`;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),3000)}
    document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');activeTab=b.dataset.tab;render()});$('search').oninput=render;$('reason').onchange=render;$('modalClose').onclick=closeModal;$('drawerOverlay').onclick=e=>{if(e.target===$('drawerOverlay'))closeDrawer()};$('modalOverlay').onclick=e=>{if(e.target===$('modalOverlay'))closeModal()};document.addEventListener('click',e=>{if(!e.target.closest('[data-menu]')&&!e.target.closest('#actionMenu'))closeActionMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('actionMenu').classList.remove('show');closeModal();closeDrawer()}});render();
  </script>
</body>
</html>
