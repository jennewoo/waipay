document.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;if(t.hasAttribute('data-confirm-cancel')){hideConfirm();return}if(t.hasAttribute('data-confirm-yes')){const fn=confirmAction;hideConfirm();fn?.();return}if(t.hasAttribute('data-save-policy')){savePolicy();return}if(t.hasAttribute('data-cancel-editor')){if(!dirtyGuard()){editor=null;closeDrawer()}return}if(t.dataset.deletePolicy&&dev()){const group=policy.groups.find(g=>g.id===t.dataset.deletePolicy);if(!group)return;showConfirm('删除个性化策略？','删除「'+group.name+'」后，其商户将恢复使用全局规则；已有风险日志不变。','删除策略',()=>{const next=Risk.clone(policy);next.groups=next.groups.filter(g=>g.id!==group.id);localStorage.setItem('waipay-risk-policy-v2',JSON.stringify(next));policy=next;render();toast('个性化策略已删除，商户恢复使用全局规则')});return}if(t.dataset.editPolicy){policyEditor(t.dataset.editPolicy);return}if(t.hasAttribute('data-new-policy')){policyEditor('new');return}if(editor&&dev()){if(t.hasAttribute('data-edit-history')){editor.section='rules';editor.category='历史偏离';renderEditor();return}if(t.hasAttribute('data-add-env-case')){const cases=Risk.clone(draftRule('environment').cases);const next=Risk.environmentOptions(cases).find(option=>!option.disabled);if(!next)return;cases.push({condition:next.value,actions:['钉钉通知','二次验证'],lockHours:24,sensitiveOperations:['修改 IP 白名单','修改 API Key'],dingTalkMobiles:['13800138000']});writeRule('environment','cases',cases);renderEditor(true);return}if(t.hasAttribute('data-remove-env-case')){const cases=Risk.clone(draftRule('environment').cases);if(cases.length>1){cases.splice(Number(t.dataset.removeEnvCase),1);writeRule('environment','cases',cases);renderEditor(true)}return}if(t.dataset.editSection){editor.section=t.dataset.editSection;renderEditor();return}if(t.dataset.editCategory){editor.category=t.dataset.editCategory;renderEditor();return}if(t.dataset.comboIndex!==undefined){editor.comboIndex=Number(t.dataset.comboIndex);renderEditor();return}if(t.dataset.memberPage){editor.pickerPage=Number(t.dataset.memberPage);$('#member-picker').innerHTML=memberPicker();return}const c=draftCombos()[editor.comboIndex];if(t.hasAttribute('data-add-condition')){const gi=Number(t.dataset.addCondition),f=Risk.conditionOptions(c,gi).find(f=>!f.disabled);if(!f){toast('本分类条件已全部添加');return}c.groups[gi].conditions.push(Risk.newCondition(f));editor.dirty=true;renderEditor(true);return}if(t.hasAttribute('data-delete-condition')){const [gi,ci]=t.dataset.deleteCondition.split(':').map(Number);if(c.groups[gi].conditions.length===1){toast('每个条件组至少保留一个条件');return}c.groups[gi].conditions.splice(ci,1);editor.dirty=true;renderEditor(true);return}if(t.hasAttribute('data-remove-condition-group')){const gi=Number(t.dataset.removeConditionGroup);if(c.kind==='relax'||c.groups.length<=1)return;showConfirm('移除条件组？','将移除本组全部条件，保存配置后生效。','移除',()=>{c.groups.splice(gi,1);editor.dirty=true;renderEditor(true)});return}if(t.hasAttribute('data-add-condition-group')){const available=Risk.availableGroupCategories(c),category=available.includes(editor.newGroupCategory)?editor.newGroupCategory:available[0];if(!category){toast('所有条件分类均已添加');return}const used=new Set(c.groups.flatMap(g=>g.conditions.map(row=>row.field))),f=Risk.conditionFields.find(f=>Risk.fieldCategory(f.key)===category&&!used.has(f.key));if(!f){toast('该分类条件已全部添加，请选择其他分类');return}c.groups.push({name:category,category,logic:'all',conditions:[Risk.newCondition(f)]});editor.dirty=true;renderEditor(true);return}if(t.hasAttribute('data-delete-combo')){const selected=draftCombos()[editor.comboIndex];showConfirm('删除组合策略？','将删除「'+(selected.name||'未命名组合')+'」，保存配置后生效。','删除',()=>{draftCombos().splice(editor.comboIndex,1);editor.comboIndex=Math.max(0,editor.comboIndex-1);editor.dirty=true;renderEditor()});return}if(t.hasAttribute('data-new-combo')){if(draftCombos().some(c=>!c.name.trim()))return;draftCombos().push({id:'combo'+Date.now(),name:'',enabled:true,kind:'action',logic:'all',outcome:'review',groups:[{name:'登录条件',logic:'all',conditions:[{field:'ipStable',op:'eq',value:false}]},{name:'付款条件',logic:'all',conditions:[{field:'amountDeviation',op:'eq',value:true}]}]});editor.comboIndex=draftCombos().length-1;editor.dirty=true;renderEditor();$('#combo-name').focus();return}}if(t.dataset.boardDomain){ui.dashboardDomain=t.dataset.boardDomain;render();return}if(t.dataset.nav){if(dirtyGuard())return;editor=null;closeDrawer();ui.view=t.dataset.nav;render();window.scrollTo(0,0)}else if(t.hasAttribute('data-close')){if(!dirtyGuard()){editor=null;closeDrawer()}}else if(t.dataset.metric)goLogs(t.dataset.metric);else if(t.dataset.rank)goLogs('all',t.dataset.rank);else if(t.dataset.chartDate)goLogs('all','',t.dataset.chartDate,t.dataset.chartHour||'');else if(t.dataset.event)eventDetail(t.dataset.event);else if(t.dataset.eventTab&&drawerContext?.kind==='event')eventDetail(drawerContext.id,t.dataset.eventTab);else if(t.dataset.policy)policyDetail(t.dataset.policy);else if(t.dataset.policyTab&&drawerContext?.kind==='policy')policyDetail(drawerContext.id,t.dataset.policyTab,drawerContext.category,drawerContext.caseIndex);else if(t.dataset.category)policyDetail(drawerContext.id,'rules',t.dataset.category);else if(t.dataset.page){ui.page=Number(t.dataset.page);render()}else if(t.hasAttribute('data-reset-filters')){Object.assign(ui,{logHour:'',logDomain:'all',logLoginAction:'all',logMerchant:'',logId:'',logName:'',logCode:'',logAccount:'',logProcessing:'all',logResult:'all',logSource:'all',logStart:Risk.today,logEnd:Risk.today,page:1});render()}else if(t.hasAttribute('data-reset-policy')){ui.policyName='';ui.policyScope='all';render()}});
document.addEventListener('pointerover',e=>{const b=e.target.closest('.chart-col');if(b)showTrendTooltip(b)});document.addEventListener('pointerout',e=>{const b=e.target.closest('.chart-col');if(b&&!b.contains(e.relatedTarget))hideTrendTooltip()});document.addEventListener('focusin',e=>{const b=e.target.closest('.chart-col');if(b)showTrendTooltip(b)});document.addEventListener('focusout',e=>{if(e.target.closest('.chart-col'))hideTrendTooltip()});document.addEventListener('scroll',()=>{hideTrendTooltip();const b=document.activeElement?.closest('.chart-col');if(b)showTrendTooltip(b)},true);document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTrendTooltip()});document.addEventListener('click',hideTrendTooltip);
document.addEventListener('submit',e=>{const form=e.target;if(!form.dataset.form)return;e.preventDefault();const d=Object.fromEntries(new FormData(form));if(form.dataset.form==='range'){try{Risk.period(d.kind,d.start,d.end);ui.range=d.kind;ui.start=d.start;ui.end=d.end;render()}catch(error){$('#range-error').textContent=error.message}}else if(form.dataset.form==='logs'){if(d.start&&d.end&&d.start>d.end){$('#log-error').textContent='开始日期不能晚于结束日期';return}Object.assign(ui,{logHour:d.hour,logDomain:d.domain,logLoginAction:d.domain==='login'?d.loginAction:'all',logMerchant:'',logId:d.id.trim(),logName:d.name.trim(),logCode:d.code.trim(),logAccount:d.account.trim(),logResult:d.result||'all',logProcessing:d.processing||'all',logSource:d.source,logStart:d.start,logEnd:d.end,page:1});render()}else{ui.policyName=d.name.trim();ui.policyScope=d.scope;render()}});
document.addEventListener('input',e=>{const el=e.target;if(!editor||!dev())return;if(el.hasAttribute('data-member-search')){const focus=el.dataset.memberSearch,pos=el.selectionStart;editor[focus==='name'?'pickerName':'pickerCode']=el.value;editor.pickerPage=1;$('#member-picker').innerHTML=memberPicker();const next=$('[data-member-search="'+focus+'"]');next.focus();next.setSelectionRange(pos,pos);return}if(editorChange(el))refreshPreview()});
document.addEventListener('change',e=>{if(e.target.name==='domain'){syncLogDomainFilters();return}if(e.target.id==='role-select'){const next=e.target.value;if(editor?.dirty){e.target.value=ui.role;showConfirm('切换视图并放弃修改？','本次配置尚未保存。','放弃并切换',()=>{editor=null;closeDrawer();ui.role=next;render()});return}editor=null;closeDrawer();ui.role=next;render();return}if(editorChange(e.target)){if(['condition','actions','sensitiveOperations'].includes(e.target.dataset.envKey)||e.target.dataset.comboKey==='logic'||e.target.dataset.key==='outcome')renderEditor(true);else refreshPreview();return}if(e.target.id==='range-kind'){if(e.target.value==='custom'){$('#custom-range').style.display='flex';return}ui.range=e.target.value;const r=Risk.period(ui.range);ui.start=r.start;ui.end=r.end;render()}});
$('#overlay').addEventListener('click',()=>{if(!$('#confirm').hidden){hideConfirm();return}if(!dirtyGuard()){editor=null;closeDrawer()}});document.addEventListener('keydown',e=>{if(!$('#confirm').hidden){if(e.key==='Escape'){hideConfirm();e.preventDefault()}if(e.key==='Tab'){const nodes=[...$('#confirm').querySelectorAll('button')];if(e.shiftKey&&document.activeElement===nodes[0]){nodes.at(-1).focus();e.preventDefault()}else if(!e.shiftKey&&document.activeElement===nodes.at(-1)){nodes[0].focus();e.preventDefault()}}return}if(!$('#drawer').classList.contains('show'))return;if(e.key==='Escape'){if(!$('#confirm').hidden){hideConfirm()}else if(!dirtyGuard()){editor=null;closeDrawer()}e.preventDefault()}if(e.key==='Tab'){const list=[...$('#drawer').querySelectorAll('button:not([disabled]),select:not([disabled]),input:not([disabled]),textarea:not([disabled])')].filter(el=>el.getClientRects().length),first=list[0],last=list.at(-1);if(e.shiftKey&&(document.activeElement===first||!list.includes(document.activeElement))){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});render();
</script></body></html>
