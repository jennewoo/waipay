/* v3.4: one visual language for the OMS workspace, based on Arco's public tokens */
:root{

}
body{color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5}

.nav:hover{background:#f2f3f5;color:var(--ink)}

.nav.active:before{display:none}
.side-note{color:var(--muted);border-color:var(--line)}
.topbar{height:60px;padding:0 24px;border-color:var(--line)}
.crumb{color:var(--muted)}.crumb strong{color:var(--ink)}
.content{max-width:1600px;padding:24px 28px 40px}
.page-head{margin-bottom:18px;min-height:50px}

.head-actions{justify-content:flex-end}
.button{min-height:32px;border-color:#c9cdd4;color:var(--text-secondary);font-weight:500;background:#fff;border-radius:4px;box-shadow:none}
.button:hover{border-color:var(--blue);color:var(--blue);background:#fff}

.button.danger{color:var(--danger-deep);border-color:#f7aca9;background:#fff}
.button.danger:hover{background:#ffece8;border-color:var(--danger-deep)}
.button.false-positive{background:var(--danger-deep);border-color:var(--danger-deep);color:#fff}
.button.false-positive:hover{background:#ad1f24;border-color:#ad1f24;color:#fff}
.button:disabled,.input:disabled,.select:disabled{cursor:not-allowed;opacity:1;color:var(--text-disabled);background:#f7f8fa;border-color:var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.input,.select,.field textarea{color:var(--ink);border-color:#c9cdd4;border-radius:4px;font-size:14px;min-height:32px}
.input::placeholder,textarea::placeholder{color:var(--muted)}
.input:focus,.select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 2px #165dff1a}
.card,.panel,.table-card,.score-config-panel{border:1px solid var(--line);border-radius:4px;background:#fff;box-shadow:none}
.table-top{padding:16px 20px 12px}.table-top h2,.panel-title h2{font-size:15px;font-weight:600;color:var(--ink)}
.filters{padding:16px 20px;gap:12px}.filter-field>span{color:var(--text-secondary);font-weight:500}
.detailed-filters{gap:12px 16px}.filter-field{flex-basis:190px;max-width:240px}

.maincell,.rule-name{font-weight:600}

.monitor-tab,.score-tab,.detail-tabs button{color:var(--text-secondary)}

.dashboard-metric-group .stat{min-height:100px;padding:15px 17px;border-radius:4px}
.dashboard-metric-group .stat .label{color:var(--text-secondary);font-size:13px}
.dashboard-metric-group .stat .value{font-size:27px;color:var(--ink);font-weight:600;line-height:1.2;margin-top:6px}
.dashboard-metric-group .stat .value.red-text{color:var(--danger-deep)}
.dashboard-metric-group .stat .value.orange-text{color:var(--warning-deep)}
.dashboard-metric-group .stat .foot{color:var(--muted);margin-top:5px}
.metric-unit{color:var(--muted);font-weight:400}
.control-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:4px;background:#fff}
.control-metric{padding:13px 17px;border-right:1px solid var(--line);min-width:0}
.control-metric:last-child{border-right:0}.control-metric-label{color:var(--text-secondary);font-size:13px}
.control-metric-value{font-size:21px;font-weight:600;color:var(--ink);line-height:1.2;margin-top:4px}
.control-metric-value.red-text{color:var(--danger-deep)}.control-metric-value.orange-text{color:var(--warning-deep)}
.control-metric-value small{font-size:12px;font-weight:400;margin-left:3px;color:var(--muted)}
.control-metric-foot{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.4}
.note,.preview,.policy-config-guide{background:#f7f8fa;border-color:var(--line);color:var(--text-secondary)}
.note strong,.preview strong{color:var(--ink)}
.status-banner{background:#fff7e8;border-color:#ffcf8b;color:#793e00}
.status-banner.danger,.danger-warning,.false-positive-box{background:#ffece8;border-color:#f7aca9;color:#8f1d22}
.false-positive-box strong,.false-positive-box span{color:#8f1d22}
.drawer{box-shadow:-8px 0 24px #1d212924}.drawer-head,.drawer-foot{border-color:var(--line)}
.drawer-head h2,.modal-head h2{color:var(--ink);font-size:18px;font-weight:600}
.drawer-head p,.modal-head p{color:var(--muted)}
.drawer-foot{background:#fff}.drawer-foot .footer-message{color:var(--text-secondary)}
.modal{box-shadow:var(--shadow)}.modal-head,.modal-foot{border-color:var(--line)}
.field label{color:var(--ink);font-weight:500}
.detail-line span:first-child{color:var(--muted)}
.event-summary,.env-case{background:#f7f8fa;border-color:var(--line)}
.policy-section-nav{background:#f7f8fa;border-color:var(--line)}
.policy-section-nav button{color:var(--text-secondary)}
.policy-section-nav button:hover{background:#f2f3f5;color:var(--ink)}
.policy-section-nav button.active{background:var(--blue-soft);color:var(--blue);border-color:var(--blue)}
.policy-panel-content .scenario-section{border-color:var(--line)}
.scenario-head p,.config-field .help,.global-source{color:var(--muted)!important}
.picker-row input{accent-color:var(--blue)}
.toast{background:#1d2129;color:#fff;box-shadow:var(--shadow)}

.action-choice-group>div{display:flex;flex-wrap:wrap;column-gap:24px;row-gap:4px}

// Stable sample accepted-payment data for profile interaction; not production records.
const PaymentHabits=(()=>{
 const DAY=86400000,end=Date.UTC(2026,9,8),sources=['API','人工导入','单笔提交'];
 const bands=[['低于 100 USD',0,100],['100–不足 1,000 USD',100,1000],['1,000–不足 5,000 USD',1000,5000],['5,000 USD 及以上',5000,Infinity]];
 function records(accounts){return accounts.flatMap(a=>{if(a.paymentHistoryAvailable===false)return [];const seed=[...a.id].reduce((n,c)=>n+c.charCodeAt(0),0),out=[];for(let ago=1;ago<=400;ago++){const date=end-ago*DAY,weekend=[0,6].includes(new Date(date).getUTCDay()),count=weekend?(seed+ago)%3:3+(seed+ago)%5;for(let i=0;i<count;i++){const recent=ago<=7,source=sources[(seed+ago+i+(recent?1:0))%3],amount=[75,350,850,1800,4200,7600][(seed+ago+i+(recent?2:0))%6];out.push({account:a.id,at:date+(9+(i%8))*3600000,amount,source,weekend,status:(seed+ago+i)%9===0?'失败':'成功'});}}return out;});}
 function aggregate(list){const sum=list.reduce((n,r)=>n+r.amount,0),paymentDays=new Set(list.map(r=>new Date(r.at).toISOString().slice(0,10))).size;return {count:list.length,amount:sum,paymentDays,dailyCount:paymentDays?list.length/paymentDays:0,dailyAmount:paymentDays?sum/paymentDays:0,average:list.length?sum/list.length:0};}
 function compare(all,days,baselineDays=60){const cut=end-days*DAY,start=cut-baselineDays*DAY,current=all.filter(r=>r.at>=cut&&r.at<end),baseline=all.filter(r=>r.at>=start&&r.at<cut);return {current,baseline,days,baselineDays,cut,start,end,currentStats:aggregate(current),baselineStats:aggregate(baseline)};}
 function calendarDays(start,end,weekend){let n=0;for(let t=start;t<end;t+=DAY)if([0,6].includes(new Date(t).getUTCDay())===weekend)n++;return n;}
 return {records,compare,aggregate,calendarDays,bands,sources};
})();

 const split=(list,fn)=>list.filter(fn),dayRows=[['工作日（周一至周五）',false],['非工作日（周六、周日）',true]].map(([name,weekend])=>{const c=split(d.current,r=>r.weekend===weekend),b=split(d.baseline,r=>r.weekend===weekend),cn=PaymentHabits.calendarDays(d.cut,d.end,weekend),bn=PaymentHabits.calendarDays(d.start,d.cut,weekend),cs=PaymentHabits.aggregate(c,cn),bs=PaymentHabits.aggregate(b,bn);return `<tr><td>${name}</td><td>${c.length} 笔<div class="minor">${habitNum(cs.dailyCount)} 笔/日</div></td><td>${habitNum(cs.amount)}<div class="minor">${habitNum(cs.dailyAmount)} /日</div></td><td>${habitNum(bs.dailyCount)} 笔/日<div class="minor">${habitNum(bs.dailyAmount)} USD/日</div></td><td>${change(cs.dailyCount,bs.dailyCount)}</td></tr>`}).join('');

function inputFor(f,id,value){if(f.type==='actions'){const groups=[['通知方式',f.options.filter(x=>['钉钉通知','电话通知'].includes(x))],['业务管控',f.options.filter(x=>!['钉钉通知','电话通知'].includes(x))]];return `<div class="action-choices" id="${id}">${groups.filter(([,items])=>items.length).map(([title,items])=>`<div class="action-choice-group"><span>${title}</span><div>${items.map(option=>`<label><input type="checkbox" name="${id}" value="${esc(option)}" ${(value||[]).includes(option)?'checked':''}> ${esc(option)}</label>`).join('')}</div></div>`).join('')}</div>`}if(f.type==='multi')return `<div class="action-choices multi-options" id="${id}">${f.options.map(option=>`<label><input type="checkbox" name="${id}" value="${esc(option)}" ${(value||[]).includes(option)?'checked':''}> ${esc(option)}</label>`).join('')}</div>`;if(f.type==='phones')return `<div><textarea class="input phone-list-input" id="${id}" rows="2" placeholder="每行一个手机号，或用逗号分隔">${esc((value||[]).join('\n'))}</textarea><small class="minor">支持 11 位大陆手机号或带 + 国家码的 8—15 位国际号码；最多 20 个。</small><small class="phone-status" id="${id}-phone-status" aria-live="polite"></small></div>`;return f.type==='number'?`<input class="input" id="${id}" type="number" min="${f.min}" max="${f.max}" step="${f.step||1}" value="${value}" ${f.fixed?'disabled':''}>`:`<select class="select" id="${id}">${options(f.options,value)}</select>`}
function parsePhones(text){return String(text||'').split(/[\s,，;；]+/).map(x=>x.trim()).filter(Boolean)}
function validatePhoneField(input){const numbers=parsePhones(input.value),status=$('#'+input.id+'-phone-status');if(!status)return;const invalid=numbers.find(phone=>!(/^(1[3-9]\d{9}|\+[1-9]\d{7,14})$/).test(phone)),duplicate=new Set(numbers).size!==numbers.length;status.textContent=numbers.length>20?'最多填写 20 个手机号':invalid?`号码 ${invalid} 位数或格式不正确`:duplicate?'存在重复手机号，请删除重复项':numbers.length?`已填写 ${numbers.length} 个手机号`:' ';status.classList.toggle('invalid',numbers.length>20||!!invalid||duplicate)}
function readControl(f,id){if(f.type==='actions'||f.type==='multi')return $$(`input[name="${id}"]:checked`).map(x=>x.value);const input=$('#'+id);return f.type==='number'?(input.value.trim()===''?NaN:Number(input.value)):f.type==='phones'?parsePhones(input.value):input.value}
function sameValue(a,b){return JSON.stringify(a)===JSON.stringify(b)}
function scalarEditor(t,group,personalized=false){
 const rule={...state.global.rules[t.id],...(group?.fields[t.id]||{})};
 const rows=t.fields.filter(f=>!['windowUnit','rateWindowUnit','rateDurationUnit'].includes(f.key)).map(f=>{
  const id=`cfg-${t.id}-${f.key}`,isTime=f.key==='window'&&t.fields.some(x=>x.key==='windowUnit'),unit=t.fields.find(x=>x.key==='windowUnit');
  const rateTime=['rateWindow','rateDuration'].includes(f.key),rateUnit=t.fields.find(x=>x.key===(f.key==='rateWindow'?'rateWindowUnit':'rateDurationUnit'));
  const control=rateTime?`<div class="time-inline">${inputFor(f,id,rule[f.key])}${inputFor(rateUnit,`cfg-${t.id}-${rateUnit.key}`,rule[rateUnit.key])}</div>`:isTime?`<div class="time-inline">${inputFor(f,id,rule.window)}${inputFor(unit,`cfg-${t.id}-windowUnit`,rule.windowUnit)}</div>`:inputFor(f,id,rule[f.key]);
  const globalValue=rateTime?`${state.global.rules[t.id][f.key]} ${state.global.rules[t.id][rateUnit.key]}`:isTime?`${state.global.rules[t.id].window} ${state.global.rules[t.id].windowUnit}`:fieldValue(state.global.rules[t.id][f.key],f);
  const conditional=f.whenField?`data-dependent-field="cfg-${t.id}-${f.whenField}" data-dependent-value="${esc(f.whenValue)}" ${rule[f.whenField]===f.whenValue?'':'hidden'}`:f.when?`data-dependent-action="${esc(f.when)}" data-action-choices="cfg-${t.id}-actions" ${rule.actions.includes(f.when)?'':'hidden'}`:'';
  return `<div class="scenario-field-row" ${conditional}><label ${f.type==='actions'||f.type==='multi'?'':`for="${id}"`}>${esc(f.label)}${f.unit?'（'+f.unit+'）':''}</label><div class="scenario-control">${control}${f.key==='rateCount'?'<small>按整个商户的主账号、子账号及所有付款来源合并计数；批量按订单笔数计数，超出剩余额度时本批全部拒绝提交。</small>':''}${f.key==='rateDuration'?'<small>到期自动结束，也可由运营双验证提前解除；解除不恢复健康分或重新提交失败订单。</small>':''}${t.id==='historyAmount'&&f.key==='statisticsDays'?'<small>截至昨日的完整自然日；仅有有效受理付款的日期计入分母，同一天多笔只算 1 个付款日。无付款历史时不计算均值。</small><small>付款基准金额＝窗口总金额 ÷ 实际付款天数；付款基准笔数＝窗口总笔数 ÷ 实际付款天数。基准按商户自动计算，不作为固定值填写。</small>':''}${t.id==='historyAmount'&&f.key==='countMultiple'?'<small id="history-threshold-preview"></small>':''}${t.id==='login'&&f.key==='count'?'<small>达到该次数后，暂停触发账号的新登录。</small>':''}${t.id==='login'&&f.key==='lockHours'?'<small>到期自动解除本条登录限制；运营可提前解禁。</small>':''}${t.id==='login'&&f.type==='actions'?'<small>暂停该账号登录为必要保护，可同时选择通知方式。</small>':''}${personalized&&!f.fixed?`<small class="global-source">全局规则：${esc(globalValue)}</small>`:''}</div></div>`;
 }).join('');
 return `<div class="scenario-section"><div class="scenario-head"><h3>${esc(t.name)}</h3><p>${esc(t.description)}</p></div>${rows}${t.fixed?`<div class="scenario-field-row"><span>固定等级</span><strong>${esc(t.fixed.level)}</strong></div>`:''}</div>`;
}

 if(el.id==='list-subject-type')updateListSubject();else if(el.id==='sim-merchant'){$('#sim-account').innerHTML=options(M.accounts(el.value).map(a=>[a.id,a.login]),el.value+'-ops');updateSimulation()}else if(el.name==='sim-rule'||el.id==='sim-account'||el.name==='sim-env-case')updateSimulation();else if(el.name?.startsWith('stage-action-')||el.id?.startsWith('stage-lock-'))updateStagePreview()
});
document.addEventListener('input',event=>{if(event.target.id?.startsWith('cfg-historyAmount-'))updateHistoryConfig();if(event.target.classList?.contains('phone-list-input'))validatePhoneField(event.target);if(event.target.id==='sim-id'||event.target.id==='sim-payee-account')updateSimulation();if(event.target.id==='policy-event-cap')updateCapImpact();if(event.target.id.startsWith('stage-name-')||event.target.id.startsWith('stage-max-'))updateStagePreview();if(event.target.id==='picker-name'||event.target.id==='picker-code'){editorContext[event.target.id==='picker-name'?'pickerName':'pickerCode']=event.target.value.trim();editorContext.pickerPage=1;renderMerchantPicker()}if(event.target.id==='list-merchant-name'||event.target.id==='list-merchant-code'){listEditorContext[event.target.id==='list-merchant-name'?'name':'code']=event.target.value.trim();listEditorContext.page=1;listMerchantResults()}});
$('#overlay').addEventListener('click',()=>$('#modal').classList.contains('show')?closeModal():requestCloseDrawer());
document.addEventListener('keydown',event=>{
 const layer=$('#modal').classList.contains('show')?$('#modal'):$('#drawer').classList.contains('show')?$('#drawer'):null;if(!layer)return;
 if(event.key==='Escape'){event.preventDefault();layer.id==='modal'?closeModal():requestCloseDrawer();return}
 if(event.key==='Tab'){const nodes=[...layer.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex="0"]')].filter(node=>node.getClientRects().length);if(!nodes.length)return;const first=nodes[0],last=nodes.at(-1);if(event.shiftKey&&(document.activeElement===first||!nodes.includes(document.activeElement))){event.preventDefault();last.focus()}else if(!event.shiftKey&&(document.activeElement===last||!nodes.includes(document.activeElement))){event.preventDefault();first.focus()}}
});
document.addEventListener('input',trackDraft);
document.addEventListener('change',trackDraft);
render();
setInterval(()=>{if(M.expireRestrictions(state)){persist();render()}},60000);
</script>
</body>
</html>
